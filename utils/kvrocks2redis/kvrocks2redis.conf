################################ GENERAL #####################################

# The value should be INFO, WARNING, ERROR, FATAL.
#
# Default: INFO
log-level INFO

# By default kvrocks2redis does not run as a daemon. Use 'yes' if you need it.
# Note that kvrocks2redis will write a pid file in /var/run/kvrocks2redis.pid when daemonized.
#
# Default: no
daemonize no

# The kvrocks working directory.
# Note that you must specify a directory here, not a file name.
#
# Default: ./data
data-dir ./data

# Intermediate files are output to this directory when the kvrocks2redis program runs.
#
# Default: ./
output-dir ./


# Enable cluster mode for the SOURCE kvrocks instance.
# Set to yes if kvrocks was started with cluster_enabled, so that slot_id
# prefixes are correctly stripped from keys during parsing.
#
# Default: no
cluster-enabled no

# Enable Redis Cluster mode for the TARGET Redis.
# When set to yes, the namespace host/port is treated as a cluster entry node.
# Full topology is auto-discovered via CLUSTER SLOTS, and each command is
# routed to the correct master node based on the key's CRC16 slot.
# When set to no (default), writes go to a single Redis instance as before.
#
# Default: no
target-cluster-enabled no

################################ NAMESPACE AND Sync Target Redis #####################################
# Synchronize the specified namespace data to the specified Redis DB.
# Warning: It will flush the target redis DB data.
#
# namespace.{namespace} <redis_ip> <redis_port> [<redis_auth> <redis_db_number>]
# Default redis_db_number is 0
namespace.__namespace 127.0.0.1 6379
